
<!DOCTYPE html>
<html lang="ar">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#080714">
  <title>NEXBOT — Logo</title>

  <link rel="stylesheet" href="css/logo.css">

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      overflow: hidden;
      background:
        radial-gradient(
          ellipse at center,
          rgba(64, 25, 120, 0.3),
          transparent 65%
        ),
        #080714;
    }

    .logo-stage {
      width: 100%;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      text-align: center;
    }
  </style>
</head>

<body>
  <main class="logo-stage">
    <div class="nexbot-logo" aria-label="NEXBOT">
      NEXBOT
    </div>
  </main>
</body>
</html>
